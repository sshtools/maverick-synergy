# Maverick Synergy Server - Default Configuration (sshd.cfg)
# ===========================================================
# All directives are commented out showing their default values.
# This file is loaded automatically by SshServerContext from the classpath
# or working directory.  Copy and uncomment directives to customise.
#
# File format:
#   Key value
#   Match <pattern>
#   Key value
#   End
#
# Pattern matching applies to the remote IP address.
# Lines beginning with '#' are comments.


# -------------------------------------------------------------------------
# Network
# -------------------------------------------------------------------------

# Port to listen on. May appear multiple times.
# Default: 22
#Port 22

# Address(es) to listen on. May appear multiple times.
# Default: all interfaces
#ListenAddress 0.0.0.0


# -------------------------------------------------------------------------
# Host keys
# -------------------------------------------------------------------------

# Paths to host key files.  Type is detected from the filename.
#HostKey /etc/ssh/ssh_host_ed25519_key
#HostKey /etc/ssh/ssh_host_rsa_key


# -------------------------------------------------------------------------
# Server identity
# -------------------------------------------------------------------------

# Override the software version string in the SSH banner.
# Default: MaverickSynergy
#SoftwareVersionComments MaverickSynergy


# -------------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------------

# Enable password authentication.
# Default: yes
#PasswordAuthentication yes

# Enable public-key authentication.
# Default: yes
#PubkeyAuthentication yes

# Maximum authentication attempts before disconnection.
# Default: 10
#MaxAuthentications 10

# Banner message shown to clients before authentication.
# Default: (none)
#Banner Welcome to this server.

# Authorised keys file.  %USERNAME% is substituted at login time.
# Default: .ssh/authorized_keys  (resolved via FileSystemPolicy)
#AuthorizedKeysFile /home/%USERNAME%/.ssh/authorized_keys


# -------------------------------------------------------------------------
# Forwarding
# -------------------------------------------------------------------------

# Allow TCP port forwarding.
# Default: no
#AllowForwarding no

# Allow gateway (remote) forwarding.
# Default: no
#GatewayForwarding no


# -------------------------------------------------------------------------
# Algorithms
# -------------------------------------------------------------------------

#Kex curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group14-sha256
#HostKeyAlgorithms ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-256,rsa-sha2-512
#Ciphers aes128-ctr,aes192-ctr,aes256-ctr
#MACs hmac-sha2-256,hmac-sha2-512
#Compressions none


# -------------------------------------------------------------------------
# DH group exchange
# -------------------------------------------------------------------------

# Default: 2048
#MinDHGroupExchangeKeySize 2048
# Default: 2048
#PreferredDHGroupExchangeKeySize 2048
# Default: 2048
#MaxDHGroupExchangeKeySize 2048


# -------------------------------------------------------------------------
# Rekey
# -------------------------------------------------------------------------

# Default: 1073741824 (1 GiB)
#MaxNumBytesBeforeRekey 1073741824
# Default: 2147483647
#MaxNumPacketsBeforeRekey 2147483647


# -------------------------------------------------------------------------
# Idle / keep-alive
# -------------------------------------------------------------------------

# Default: 600
#IdleConnectionTimeout 600
# Default: 30
#IdleAuthenticationTimeout 30
# Default: 30
#KeepAliveInterval 30
# Default: 128
#KeepAliveDataMaxLength 128
# Default: no
#SendIgnorePacketOnIdle no


# -------------------------------------------------------------------------
# Channels / sessions
# -------------------------------------------------------------------------

# Default: 100
#ChannelLimit 100
# Default: 131328
#MaximumPacketLength 131328


# -------------------------------------------------------------------------
# Server behaviour
# -------------------------------------------------------------------------

# Default: no
#ForceServerPreferences no
# Default: no
#EnsureGracefulDisconnect no
# Default: no
#DisableExtensionInfo no
# Default: yes
#SHA1SignaturesSupported yes
# Default: 6
#CompressionLevel 6


# -------------------------------------------------------------------------
# Algorithm isolation (testing only)
# -------------------------------------------------------------------------

#Isolate no
#IsolatedKex ecdh-sha2-nistp256
#IsolatedCipher aes128-ctr
#IsolatedMac hmac-sha1
#IsolatedCompression none
#IsolatedPublicKey ssh-rsa
