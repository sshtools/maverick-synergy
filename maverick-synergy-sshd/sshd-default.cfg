# Maverick Synergy SSHD - Reference Configuration
# ===================================================
# All directives are commented out showing their default values.
# Copy to sshd.cfg and uncomment/modify as needed.
#
# File format:
#   Key value
#   Match <pattern>
#   Key value
#   End
#
# Pattern matching uses glob syntax on the remote IP address or hostname.
# Multiple Match blocks are supported. Use 'End' to close a block.
# Lines beginning with '#' are comments.


# -------------------------------------------------------------------------
# Network
# -------------------------------------------------------------------------

# Port to listen on (may appear multiple times for multiple ports).
# Default: 2222 (SynergySSHD default; standard SSHD default is 22)
#Port 2222

# Address(es) to listen on (may appear multiple times).
# Default: all interfaces
#ListenAddress 0.0.0.0
#ListenAddress ::


# -------------------------------------------------------------------------
# Host keys
# -------------------------------------------------------------------------

# Paths to host key files. If a file does not exist it will be generated.
# If no HostKey directives are present, keys are auto-generated in the
# working directory: ssh_host_rsa, ssh_host_ecdsa_256, ssh_host_ed25519, etc.
# Type is detected from the filename (rsa, ecdsa, ed25519, ed448).
#HostKey /etc/ssh/ssh_host_ed25519_key
#HostKey /etc/ssh/ssh_host_rsa_key
#HostKey /etc/ssh/ssh_host_ecdsa_256_key


# -------------------------------------------------------------------------
# Server identity
# -------------------------------------------------------------------------

# Override the software version string sent in the SSH banner.
# Default: MaverickSynergy
#SoftwareVersionComments MaverickSynergy


# -------------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------------

# Enable or disable password authentication.
# Default: yes
#PasswordAuthentication yes

# Enable or disable public-key authentication.
# Default: yes
#PubkeyAuthentication yes

# Maximum number of authentication attempts before disconnecting.
# Default: 10
#MaxAuthentications 10

# Banner text shown to clients before authentication.
# Default: (none)
#Banner Welcome to this server.

# User accounts. The second token is the BCrypt hash of the password,
# produced by: java -jar maverick-synergy-sshd.jar passwd
# This directive may appear multiple times for multiple users.
#User admin $2a$12$...


# -------------------------------------------------------------------------
# Authorized keys
# -------------------------------------------------------------------------

# Path to the authorized_keys file for public-key authentication.
# %USERNAME% is substituted with the connecting user's name at login time.
# Absolute paths are used as-is; relative paths are resolved under
# /home/<username>/.
# Default: .ssh/authorized_keys
#AuthorizedKeysFile /home/%USERNAME%/.ssh/authorized_keys


# -------------------------------------------------------------------------
# Virtual filesystem mounts
# -------------------------------------------------------------------------

# Map virtual (SSH) paths to real directories on the host.
# Format: VirtualMount <virtual-path> <real-path>
# %USERNAME% is substituted with the connecting user's name at login time.
# The first entry becomes the default (root) mount. Subsequent entries are
# additional mounts. If no VirtualMount directives are present, the user's
# UNIX home directory (/home/<username>) is mounted at /.
#VirtualMount / /home/%USERNAME%
#VirtualMount /data /srv/shared


# -------------------------------------------------------------------------
# Port forwarding
# -------------------------------------------------------------------------

# Allow TCP port forwarding.
# Default: no
#AllowForwarding no

# Allow gateway (remote) forwarding via -R.
# Default: no
#GatewayForwarding no


# -------------------------------------------------------------------------
# Algorithms
# -------------------------------------------------------------------------

# Comma-separated list of allowed key exchange algorithms.
# Default: (library defaults by SecurityLevel)
#Kex curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group14-sha256

# Comma-separated list of allowed host key algorithms.
# Default: (library defaults by SecurityLevel)
#HostKeyAlgorithms ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-256,rsa-sha2-512

# Comma-separated list of allowed ciphers.
# Default: (library defaults by SecurityLevel)
#Ciphers aes128-ctr,aes192-ctr,aes256-ctr

# Comma-separated list of allowed MAC algorithms.
# Default: (library defaults by SecurityLevel)
#MACs hmac-sha2-256,hmac-sha2-512

# Comma-separated list of allowed compression algorithms.
# Default: none
#Compressions none


# -------------------------------------------------------------------------
# DH group exchange
# -------------------------------------------------------------------------

# Minimum DH group exchange key size in bits.
# Default: 2048
#MinDHGroupExchangeKeySize 2048

# Preferred DH group exchange key size in bits.
# Default: 2048
#PreferredDHGroupExchangeKeySize 2048

# Maximum DH group exchange key size in bits.
# Default: 2048
#MaxDHGroupExchangeKeySize 2048


# -------------------------------------------------------------------------
# Rekey thresholds
# -------------------------------------------------------------------------

# Force rekeying after this many bytes of data transfer.
# Default: 1073741824 (1 GiB)
#MaxNumBytesBeforeRekey 1073741824

# Force rekeying after this many packets.
# Default: 2147483647
#MaxNumPacketsBeforeRekey 2147483647


# -------------------------------------------------------------------------
# Idle / keep-alive
# -------------------------------------------------------------------------

# Disconnect idle connections after this many seconds (0 = never).
# Default: 600
#IdleConnectionTimeout 600

# Disconnect unauthenticated connections after this many seconds.
# Default: 30
#IdleAuthenticationTimeout 30

# Interval between keep-alive messages in seconds (0 = disabled).
# Default: 30
#KeepAliveInterval 30

# Maximum length of data payload in keep-alive packets.
# Default: 128
#KeepAliveDataMaxLength 128

# Send an SSH_MSG_IGNORE packet when the connection is idle instead of
# a keep-alive request.
# Default: no
#SendIgnorePacketOnIdle no


# -------------------------------------------------------------------------
# Channels / sessions
# -------------------------------------------------------------------------

# Maximum number of simultaneous channels per connection.
# Default: 100
#ChannelLimit 100

# Maximum packet length in bytes.
# Default: 131328
#MaximumPacketLength 131328


# -------------------------------------------------------------------------
# Server behaviour
# -------------------------------------------------------------------------

# Force the server's algorithm preference order even when the client
# sends its preferences first.
# Default: no
#ForceServerPreferences no

# Ensure a graceful SSH disconnect before closing the socket.
# Default: no
#EnsureGracefulDisconnect no

# Allow SHA-1 RSA signatures. Set to no to enforce SHA-2 only (ssh-rsa disabled).
# Default: yes
#SHA1SignaturesSupported yes

# Compression level for zlib compression (1=fastest, 9=best, 6=default).
# Only effective when Compressions includes a zlib variant.
# Default: 6
#CompressionLevel 6


# -------------------------------------------------------------------------
# Algorithm isolation mode (diagnostic / testing)
# -------------------------------------------------------------------------

# Restrict all connections to a single algorithm set for testing.
# When Isolate is enabled the remaining directives select the algorithm.
# Default: no
#Isolate no
#IsolatedKex ecdh-sha2-nistp256
#IsolatedCipher aes128-ctr
#IsolatedMac hmac-sha1
#IsolatedCompression none
#IsolatedPublicKey ssh-rsa


# -------------------------------------------------------------------------
# Match blocks
# -------------------------------------------------------------------------
# Example: apply different settings for localhost connections.
#Match 127.0.0.1
#PasswordAuthentication yes
#End
