# Maverick Synergy Client - Default Configuration (ssh.cfg)
# ==========================================================
# All directives are commented out showing their default values.
# This file is loaded automatically by SshClientContext from the classpath
# or working directory.  Copy and uncomment directives to customise.
#
# File format:
#   Key value
#   Match <pattern>
#   Key value
#   End
#
# Pattern matching applies to the remote hostname or IP address.
# Lines beginning with '#' are comments.


# -------------------------------------------------------------------------
# Connection
# -------------------------------------------------------------------------

# Default username used when none is specified.
# Default: guest
#GuestUsername guest

# Default connect timeout in milliseconds.
# Default: 30000
#DefaultConnectTimeout 30000


# -------------------------------------------------------------------------
# Authentication
# -------------------------------------------------------------------------

# Prefer keyboard-interactive over password authentication.
# Default: yes
#PreferKeyboardInteractive yes


# -------------------------------------------------------------------------
# SFTP
# -------------------------------------------------------------------------

# SFTP protocol version to negotiate.
# Default: 6
#SftpVersion 6


# -------------------------------------------------------------------------
# Forwarding
# -------------------------------------------------------------------------

# Allow TCP port forwarding.
# Default: no
#AllowForwarding no

# Allow gateway forwarding.
# Default: no
#GatewayForwarding no


# -------------------------------------------------------------------------
# Algorithms
# -------------------------------------------------------------------------

#KexAlgorithms curve25519-sha256,ecdh-sha2-nistp256,diffie-hellman-group14-sha256
#HostKeyAlgorithms ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-256,rsa-sha2-512
#Ciphers aes128-ctr,aes192-ctr,aes256-ctr
#MACs hmac-sha2-256,hmac-sha2-512
#Compression none


# -------------------------------------------------------------------------
# DH group exchange
# -------------------------------------------------------------------------

# Default: 2048
#MinDHGroupExchangeKeySize 2048
# Default: 2048
#PreferredDHGroupExchangeKeySize 2048
# Default: 8192
#MaxDHGroupExchangeKeySize 8192


# -------------------------------------------------------------------------
# Rekey
# -------------------------------------------------------------------------

# Default: 1073741824 (1 GiB)
#MaxNumBytesBeforeRekey 1073741824
# Default: 2147483647
#MaxNumPacketsBeforeRekey 2147483647


# -------------------------------------------------------------------------
# Idle / keep-alive
# -------------------------------------------------------------------------

# Default: 600
#IdleConnectionTimeout 600
# Default: 30
#IdleAuthenticationTimeout 30
# Default: 30
#KeepAliveInterval 30
# Default: 128
#KeepAliveDataMaxLength 128
# Default: no
#SendIgnorePacketOnIdle no


# -------------------------------------------------------------------------
# Transport
# -------------------------------------------------------------------------

# Default: 131328
#MaximumPacketLength 131328

# Ping timeout for connection health check in milliseconds.
# Default: 60000
#PingTimeout 60000


# -------------------------------------------------------------------------
# Algorithm isolation (testing only)
# -------------------------------------------------------------------------

#Isolate no
#IsolatedKex ecdh-sha2-nistp256
#IsolatedCipher aes128-ctr
#IsolatedMac hmac-sha1
#IsolatedCompression none
#IsolatedPublicKey ssh-rsa
